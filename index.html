<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmita Flash</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:linear-gradient(135deg,#ff6a00,#ff9500);
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{
  font-size:30px;
  margin-bottom:8px;
}

header p{
  font-size:15px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

h2{
  font-size:20px;
  margin-bottom:15px;
}

.tamanhos{
  display:flex;
  gap:12px;
}

.tamanho{
  flex:1;
  border:2px solid #ddd;
  background:white;
  border-radius:15px;
  padding:18px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.tamanho small{
  font-size:14px;
}

.tamanho.ativo{
  background:#ff6a00;
  border-color:#ff6a00;
  color:white;
}

label{
  display:block;
  background:#fafafa;
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}

input{
  margin-right:8px;
}

input[type="text"]{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.entrega{
  display:flex;
  gap:10px;
}

.entrega label{
  flex:1;
}

.resumo{
  background:#222;
  color:white;
}

#total{
  font-size:25px;
  font-weight:bold;
  margin-top:15px;
}

.whatsapp{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:18px;
  background:#25D366;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.voltar{
  width:100%;
  border:0;
  padding:13px;
  border-radius:12px;
  background:#eee;
  margin-bottom:15px;
  cursor:pointer;
}

#pedido{
  display:none;
}

.inicio{
  text-align:center;
}

.inicio button{
  width:100%;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#ff6a00;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ MARMITA FLASH</h1>
  <p>Comida gostosa direto na sua casa!</p>
</header>

<div class="container">

  <div id="inicio" class="card inicio">
    <h2>🍱 Monte sua marmita!</h2>
    <p>Escolha o tamanho, acompanhamentos e sua mistura.</p>

    <button onclick="abrirPedido()">
      🛒 MONTAR MINHA MARMITA
    </button>
  </div>

  <div id="pedido">

    <button class="voltar" onclick="voltarInicio()">
      ← Voltar
    </button>

    <div class="card">
      <h2>📦 Escolha o tamanho</h2>

      <div class="tamanhos">

        <button id="btnM"
                class="tamanho ativo"
                onclick="mudarTamanho('M')">
          M<br>
          <small>R$ 15,00</small>
        </button>

        <button id="btnG"
                class="tamanho"
                onclick="mudarTamanho('G')">
          G<br>
          <small>R$ 18,00</small>
        </button>

      </div>
    </div>

    <div class="card">
      <h2>🍚 Guarnições</h2>

      <label><input type="checkbox"> Baião</label>
      <label><input type="checkbox"> Arroz branco</label>
      <label><input type="checkbox"> Feijão de corda</label>
      <label><input type="checkbox"> Feijão preto</label>
      <label><input type="checkbox"> Macarrão</label>
      <label><input type="checkbox"> Farofa</label>
      <label><input type="checkbox"> Cuscuz</label>
    </div>

    <div class="card">
      <h2>🥗 Saladas</h2>

      <label><input type="checkbox"> Vinagrete</label>
      <label><input type="checkbox"> Salada de maionese</label>
      <label><input type="checkbox"> Salada verde</label>
    </div>

    <div class="card">
      <h2>🍗 Proteínas</h2>

      <label><input type="checkbox"> Frango ao molho</label>
      <label><input type="checkbox"> Bisteca de porco ao molho</label>
      <label><input type="checkbox"> Carne moída</label>
      <label><input type="checkbox"> Peixe frito</label>
      <label><input type="checkbox"> Fígado</label>
      <label><input type="checkbox"> Calabresa</label>
      <label><input type="checkbox"> Ovo frito</label>
      <label><input type="checkbox"> Frango assado</label>
      <label><input type="checkbox"> Linguiça assada</label>
      <label><input type="checkbox"> Bisteca suína assada</label>
    </div>

    <div class="card">
      <h2>🛵 Entrega</h2>

      <div class="entrega">

        <label>
          <input type="radio"
                 name="entrega"
                 value="3"
                 onchange="atualizarTotal()">
          Perto<br>
          R$ 3,00
        </label>

        <label>
          <input type="radio"
                 name="entrega"
                 value="0"
                 onchange="atualizarTotal()">
          Longe<br>
          A combinar
        </label>

      </div>
    </div>

    <div class="card">
      <h2>📍 Endereço</h2>

      <input
        id="endereco"
        type="text"
        placeholder="Digite seu endereço">
    </div>

    <div class="card resumo">

      <h2>🛒 Meu pedido</h2>

      <p id="tamanhoResumo">
        Marmita M
      </p>

      <div id="total">
        Total: R$ 15,00
      </div>

      <button class="whatsapp" onclick="enviarWhatsApp()">
        📲 FAZER PEDIDO PELO WHATSAPP
      </button>

    </div>

  </div>

</div>

<script>

const WHATSAPP = "5585997518122";

let tamanhoAtual = "M";
let precoAtual = 15;

function abrirPedido(){

  document.getElementById("inicio").style.display = "none";

  document.getElementById("pedido").style.display = "block";

}

function voltarInicio(){

  document.getElementById("pedido").style.display = "none";

  document.getElementById("inicio").style.display = "block";

}

function mudarTamanho(tamanho){

  tamanhoAtual = tamanho;

  if(tamanho === "M"){

    precoAtual = 15;

    document.getElementById("btnM").classList.add("ativo");

    document.getElementById("btnG").classList.remove("ativo");

  }

  if(tamanho === "G"){

    precoAtual = 18;

    document.getElementById("btnG").classList.add("ativo");

    document.getElementById("btnM").classList.remove("ativo");

  }

  document.getElementById("tamanhoResumo").innerText =
    "Marmita " + tamanhoAtual;

  atualizarTotal();

}

function atualizarTotal(){

  const entrega =
    document.querySelector('input[name="entrega"]:checked');

  let total = precoAtual;

  if(entrega && entrega.value === "3"){

    total = precoAtual + 3;

    document.getElementById("total").innerText =
      "Total: R$ " +
      total.toFixed(2).replace(".",",");

    return;
  }

  if(entrega && entrega.value === "0"){

    document.getElementById("total").innerText =
      "Total: R$ " +
      precoAtual.toFixed(2).replace(".",",") +
      " + taxa";

    return;
  }

  document.getElementById("total").innerText =
    "Total: R$ " +
    precoAtual.toFixed(2).replace(".",",");

}

function enviarWhatsApp(){

  const endereco =
    document.getElementById("endereco").value;

  let mensagem =
    "Olá! Quero fazer um pedido na Marmita Flash.%0A%0A" +
    "Tamanho: Marmita " + tamanhoAtual +
    "%0A" +
    "Valor: R$ " +
    precoAtual.toFixed(2).replace(".",",");

  if(endereco){

    mensagem +=
      "%0AEndereço: " +
      encodeURIComponent(endereco);

  }

  window.open(
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    mensagem,
    "_blank"
  );

}

</script>

</body>
</html>
